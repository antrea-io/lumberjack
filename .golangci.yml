# golangci-lint configuration used for CI.
version: "2"
run:
  tests: true
  timeout: 15m
linters:
  default: none
  enable:
    - gosec
    - govet
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        # G115 reports a lot of integer-conversion false positives and is not
        # accurate enough yet (see https://github.com/securego/gosec/issues/1187).
        - G115 # Potential integer overflow when converting between integer types
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: unreachable-code
        - name: errorf
        - name: range
        - name: superfluous-else
        - name: var-declaration
        - name: duplicated-imports
  exclusions:
    presets:
      - legacy
      - common-false-positives
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gopkg.in/natefinch/lumberjack.v2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
